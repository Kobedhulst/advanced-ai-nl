name: Controle cursus

on:
  push:
    branches: [main]
    paths: ["cursus/**", "scripts/check-cursus.mjs"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-cursus.mjs
